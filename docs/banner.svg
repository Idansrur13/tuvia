<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Nadlan Platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1526"/>
      <stop offset="55%" stop-color="#0f2138"/>
      <stop offset="100%" stop-color="#0c3049"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.55">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>

  <!-- skyline -->
  <g fill="url(#sky)">
    <rect x="612" y="196" width="52" height="144" rx="4"/>
    <rect x="676" y="152" width="44" height="188" rx="4"/>
    <rect x="732" y="214" width="60" height="126" rx="4"/>
    <rect x="804" y="120" width="48" height="220" rx="4"/>
    <rect x="864" y="178" width="56" height="162" rx="4"/>
    <rect x="932" y="232" width="44" height="108" rx="4"/>
    <rect x="988" y="146" width="62" height="194" rx="4"/>
    <rect x="1062" y="206" width="46" height="134" rx="4"/>
  </g>
  <g fill="#7dd3fc" opacity="0.5">
    <rect x="818" y="150" width="6" height="6"/><rect x="832" y="150" width="6" height="6"/>
    <rect x="818" y="176" width="6" height="6"/><rect x="832" y="176" width="6" height="6"/>
    <rect x="1002" y="176" width="6" height="6"/><rect x="1016" y="176" width="6" height="6"/>
    <rect x="1002" y="202" width="6" height="6"/><rect x="690" y="188" width="6" height="6"/>
    <rect x="704" y="188" width="6" height="6"/><rect x="878" y="214" width="6" height="6"/>
  </g>

  <text x="72" y="128" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Nadlan Platform</text>
  <rect x="74" y="150" width="120" height="4" rx="2" fill="url(#rule)"/>

  <text x="72" y="196" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#a8bdd6">International real-estate marketplace, dashboards for every role,</text>
  <text x="72" y="226" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#a8bdd6">and a property assistant that matches buyers to live inventory.</text>

  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="72" y="256" width="128" height="30" rx="15" fill="#0ea5e9" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.35"/>
    <text x="136" y="276" fill="#7dd3fc" text-anchor="middle">React Router 8</text>
    <rect x="210" y="256" width="102" height="30" rx="15" fill="#0ea5e9" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.35"/>
    <text x="261" y="276" fill="#7dd3fc" text-anchor="middle">TypeScript</text>
    <rect x="322" y="256" width="82" height="30" rx="15" fill="#0ea5e9" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.35"/>
    <text x="363" y="276" fill="#7dd3fc" text-anchor="middle">Prisma</text>
    <rect x="414" y="256" width="106" height="30" rx="15" fill="#0ea5e9" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.35"/>
    <text x="467" y="276" fill="#7dd3fc" text-anchor="middle">PostgreSQL</text>
  </g>

  <text x="1128" y="286" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#f5b83d" fill-opacity="0.85" text-anchor="end" direction="rtl">פלטפורמת נדל״ן בינלאומית</text>
  <text x="1128" y="60" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#7dd3fc" fill-opacity="0.7" text-anchor="end" letter-spacing="2">EN · HE · RTL</text>
</svg>
